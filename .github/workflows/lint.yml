name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: shellcheck and php -l
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and PHP
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck php-cli
      - name: ShellCheck scripts and hook
        run: shellcheck -x scripts/*.sh hooks/post-receive scripts/post-receive
      - name: PHP syntax check
        run: find wp-content -name '*.php' -print0 | xargs -0 -n1 php -l
